name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/create-knowmemaybe-site-407am]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: knowmemaybe/package-lock.json

      - name: Install dependencies
        working-directory: knowmemaybe
        run: npm ci

      - name: Build
        working-directory: knowmemaybe
        run: npx ng build --configuration=production --base-href=/GetitngToKnowSomeone---example/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./knowmemaybe/dist/knowmemaybe/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
